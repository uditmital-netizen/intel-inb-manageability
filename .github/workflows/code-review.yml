name: Compare Reviews (GPT-5.2 vs Neosmith)

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to compare (leave blank = latest open PR)"
        required: false
        type: string
      openai_model:
        description: "OpenAI model override"
        required: false
        default: "gpt-5.2-2025-12-11"
        type: string

  pull_request:
    types: [opened, synchronize, reopened]

  issue_comment:
    types: [created]

permissions:
  issues: write
  pull-requests: write
  contents: read

jobs:
  compare_reviews:
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'pull_request' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request != null &&
       contains(github.event.comment.body, '/compare-reviews'))

    runs-on: ubuntu-latest
    name: GPT-5.2 vs Neosmith comparison

    steps:
      - name: Resolve PR URL
        id: pr_url
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "url=${{ github.event.pull_request.html_url }}" >> "$GITHUB_OUTPUT"

          elif [ "${{ github.event_name }}" = "issue_comment" ]; then
            echo "url=https://github.com/${REPO}/pull/${{ github.event.issue.number }}" >> "$GITHUB_OUTPUT"

          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            PR_NUM="${{ inputs.pr_number }}"
            if [ -n "$PR_NUM" ]; then
              echo "url=https://github.com/${REPO}/pull/${PR_NUM}" >> "$GITHUB_OUTPUT"
            else
              LATEST=$(gh pr list --repo "$REPO" --state open --json number --jq '.[0].number')
              if [ -z "$LATEST" ]; then
                echo "::error::No open PRs found and no pr_number supplied."
                exit 1
              fi
              echo "url=https://github.com/${REPO}/pull/${LATEST}" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Checkout repository
        uses: actions/checkout@v4

      # Checkout pr-agent as a dependency (for imports)
      - name: Checkout qodo-ai/pr-agent
        uses: actions/checkout@v4
        with:
          repository: qodo-ai/pr-agent
          path: _pr_agent_lib

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e _pr_agent_lib/
          pip install python-dotenv

      - name: Run compare_reviews.py
        env:
          PR_URL:         ${{ steps.pr_url.outputs.url }}
          GITHUB_TOKEN:   ${{ secrets.GITHUB_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_KEY }}
          OPENAI_MODEL:   ${{ inputs.openai_model || 'gpt-5.2-2025-12-11' }}
          TINKER_API_KEY: ${{ secrets.TINKER_API_KEY }}
          NEOSMITH_MODEL: ${{ vars.NEOSMITH_MODEL || 'gpt-oss-120b' }}
        run: python scripts/compare_reviews.py --pr_url "$PR_URL" --openai_model "$OPENAI_MODEL"
