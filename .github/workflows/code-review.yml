name: Compare Reviews (GPT-5.2 vs Neosmith)

# ── Triggers ──────────────────────────────────────────────────────────────────
on:
  # 1. Manual run from GitHub UI  →  Actions tab → "Run workflow"
  #    You can optionally type a PR number; leave blank to use the latest open PR.
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to compare (leave blank for latest open PR)"
        required: false
        type: string
      openai_model:
        description: "OpenAI model override (default: gpt-5.2-2025-12-11)"
        required: false
        default: "gpt-5.2-2025-12-11"
        type: string

  # 2. Auto-run on every new PR or push to an open PR
  pull_request:
    types: [opened, synchronize, reopened]

  # 3. Trigger by typing `/compare-reviews` in a PR comment
  issue_comment:
    types: [created]

permissions:
  issues: write
  pull-requests: write
  contents: read

jobs:
  compare_reviews:
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'pull_request' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request != null &&
       contains(github.event.comment.body, '/compare-reviews'))

    runs-on: ubuntu-latest
    name: GPT-5.2 vs Neosmith comparison
    environment: OPENAI_API_KEY

    steps:
      # ── Resolve the PR URL from GitHub context ─────────────────────────────
      - name: Resolve PR URL
        id: pr_url
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "url=${{ github.event.pull_request.html_url }}" >> "$GITHUB_OUTPUT"

          elif [ "${{ github.event_name }}" = "issue_comment" ]; then
            echo "url=https://github.com/${REPO}/pull/${{ github.event.issue.number }}" >> "$GITHUB_OUTPUT"

          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            PR_NUM="${{ inputs.pr_number }}"
            if [ -n "$PR_NUM" ]; then
              echo "url=https://github.com/${REPO}/pull/${PR_NUM}" >> "$GITHUB_OUTPUT"
            else
              LATEST=$(gh pr list --repo "$REPO" --state open --json number --jq '.[0].number')
              if [ -z "$LATEST" ]; then
                echo "::error::No open PRs found and no pr_number supplied."
                exit 1
              fi
              echo "url=https://github.com/${REPO}/pull/${LATEST}" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Show resolved PR URL
        run: echo "Running compare_reviews.py against ${{ steps.pr_url.outputs.url }}"

      # ── Checkout this repo (intel-inb-manageability) — has compare_reviews.py
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Checkout qodo-ai/pr-agent (provides pr_agent.* Python package only) ─
      - name: Checkout qodo-ai/pr-agent
        uses: actions/checkout@v4
        with:
          repository: qodo-ai/pr-agent
          path: _pr_agent_lib

      # ── Python setup ──────────────────────────────────────────────────────
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Cache the entire venv — keyed on pr-agent's pyproject.toml
      # Cache hit = skip install entirely (saves ~2-3 min per run)
      - name: Cache pr-agent venv
        id: cache-venv
        uses: actions/cache@v4
        with:
          path: _pr_agent_venv
          key: pr-agent-venv-${{ runner.os }}-py3.12-${{ hashFiles('_pr_agent_lib/pyproject.toml', '_pr_agent_lib/requirements.txt') }}

      - name: Install pr-agent dependencies
        if: steps.cache-venv.outputs.cache-hit != 'true'
        working-directory: _pr_agent_lib
        run: |
          python -m venv ../_pr_agent_venv
          ../_pr_agent_venv/bin/pip install --upgrade pip
          ../_pr_agent_venv/bin/pip install -e .
          ../_pr_agent_venv/bin/pip install python-dotenv
          ../_pr_agent_venv/bin/pip install tinker
          ../_pr_agent_venv/bin/pip install "tinker_cookbook @ git+https://github.com/thinking-machines-lab/tinker-cookbook.git"

      # ── Debug: check all possible secret name variants ────────────────────
      - name: Debug secret resolution
        run: |
          echo "--- OpenAI key variants ---"
          echo "secrets.OPENAI_KEY set:      ${{ secrets.OPENAI_KEY != '' }}"
          echo "secrets.OPENAI_API_KEY set:  ${{ secrets.OPENAI_API_KEY != '' }}"
          echo "secrets.OPENAI_SECRET set:   ${{ secrets.OPENAI_SECRET != '' }}"
          echo "--- Tinker key variants ---"
          echo "secrets.TINKER_API_KEY set:  ${{ secrets.TINKER_API_KEY != '' }}"
          echo "secrets.TINKER_KEY set:      ${{ secrets.TINKER_KEY != '' }}"
          echo "--- GitHub token ---"
          echo "secrets.GITHUB_TOKEN set:    ${{ secrets.GITHUB_TOKEN != '' }}"

      # ── Run the comparison ─────────────────────────────────────────────────
      - name: Run compare_reviews.py
        env:
          PR_URL:         ${{ steps.pr_url.outputs.url }}
          GITHUB_TOKEN:   ${{ secrets.GITHUB_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_KEY:     ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL:   ${{ inputs.openai_model || 'gpt-5.2-2025-12-11' }}
          TINKER_API_KEY: ${{ secrets.TINKER_API_KEY }}
          NEOSMITH_MODEL: ${{ vars.NEOSMITH_MODEL || 'gpt-oss-120b' }}
        run: |
          _pr_agent_venv/bin/python scripts/compare_reviews.py \
            --pr_url "$PR_URL" \
            --openai_model "$OPENAI_MODEL" \
            --env_file /dev/null
